name: sync-dev-formula

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - sync-dev-formula
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-dev-formula
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Sync Entrox dev formula
        run: |
          set -euo pipefail
          status=0
          python3 - <<'PY' || status=$?
          import json
          import pathlib
          import sys
          import textwrap
          import time
          import urllib.error
          import urllib.request

          manifest_url = "https://entrox.996icu.wiki/downloads/entrox-dev/latest.json"
          attempts = 3
          timeout = 20
          unavailable_exit = 75

          def fetch(url: str) -> dict:
              for attempt in range(1, attempts + 1):
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent": "entrox-tap-sync"})
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code != 429 and error.code < 500:
                          raise
                      reason = f"HTTP {error.code}"
                  except (urllib.error.URLError, TimeoutError) as error:
                      reason = f"{type(error).__name__}: {error}"
                  except json.JSONDecodeError as error:
                      reason = f"response was not JSON: {error}"
                  print(f"attempt {attempt}/{attempts} failed ({reason})", file=sys.stderr)
                  if attempt < attempts:
                      time.sleep(3 * 2 ** (attempt - 1))
              print(f"{url} is unavailable after {attempts} attempts", file=sys.stderr)
              sys.exit(unavailable_exit)

          manifest = fetch(manifest_url)

          version = manifest.get("version") or "0.0.0-ci"
          assets = {asset["name"]: asset for asset in manifest.get("assets", [])}

          def asset(name: str) -> dict:
              value = assets.get(name)
              if not value:
                  raise RuntimeError(f"missing {name} in {manifest_url}")
              if not value.get("url") or not value.get("sha256"):
                  raise RuntimeError(f"missing url or sha256 for {name} in {manifest_url}")
              return value

          macos_arm64 = asset("entrox-cli-macos-arm64.zip")
          linux_x64 = asset("entrox-cli-linux-x64.zip")

          formula = f"""\
          # typed: false
          # frozen_string_literal: true

          class Entrox < Formula
            desc "Entrox CLI"
            homepage "https://entrox.996icu.wiki"
            version "{version}"
            license "MIT"

            on_macos do
              depends_on arch: :arm64

              url "{macos_arm64["url"]}"
              sha256 "{macos_arm64["sha256"]}"
            end

            on_linux do
              depends_on arch: :x86_64

              url "{linux_x64["url"]}"
              sha256 "{linux_x64["sha256"]}"
            end

            depends_on "ripgrep"

            def install
              bin.install "bin/entrox"
            end

            test do
              system "#{{bin}}/entrox", "--version"
            end
          end
          """
          pathlib.Path("Formula").mkdir(exist_ok=True)
          pathlib.Path("Formula/entrox.rb").write_text(textwrap.dedent(formula))
          PY
          if [ "$status" -eq 75 ]; then
            echo "::notice title=Upstream unavailable::Dev manifest service is unreachable; leaving the formula untouched."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          ruby -c Formula/entrox.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/entrox.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update Entrox dev Homebrew formula"
            git push
          fi
